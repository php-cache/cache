name: Checks

on: pull_request

jobs:
  composer-normalize:
    name: Composer Normalize
    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer-normalize

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Normalize
        run: |
          ok=0
          echo ::group::Root
          composer-normalize --dry-run
          echo ::endgroup::
          while IFS= read -r PACKAGE; do
            echo "::group::$PACKAGE"
            localExit=0
            composer-normalize "$PACKAGE" --dry-run || localExit=1
            ok=$((localExit || ok))
            echo ::endgroup::
            if [ "$localExit" -ne 0 ]; then
              echo "::error::$PACKAGE failed"
            fi
          done < <(find src -maxdepth 4 -type f -name composer.json | sort)

          exit "$ok"
